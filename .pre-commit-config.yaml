default_install_hook_types: [pre-commit]
fail_fast: false

repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: no-commit-to-branch
            args: [--branch, main]
          - id: end-of-file-fixer
          - id: trailing-whitespace
          - id: check-added-large-files
          - id: check-merge-conflict
          # The TV Time export carries live OAuth tokens; this is the backstop
          # against one ever reaching a commit.
          - id: detect-private-key

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.15.15
      hooks:
          - id: ruff
            args: ["--fix", "--show-fixes"]
            types: [python]
          - id: ruff-format
            types: [python]

    - repo: local
      hooks:
          - id: pyrefly
            name: pyrefly type check
            language: system
            entry: uv run pyrefly
            args: ["check"]
            pass_filenames: false
            files: ^(src|tests)/.*\.py$
            types: [python]

          - id: pytest
            name: pytest (hermetic suite)
            language: system
            entry: uv run pytest
            args: ["-q"]
            pass_filenames: false
            files: ^(src|tests)/.*\.py$
            types: [python]
